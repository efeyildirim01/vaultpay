# Enough connections for the concurrency tests to really run in parallel.
spring.datasource.hikari.maximum-pool-size=20
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=off
# The suite logs in and transfers far more often than a person would; RateLimitApiTest uses its own low limits.
vaultpay.rate-limit.login-per-window=100000
vaultpay.rate-limit.money-per-window=100000
