spring.application.name=vaultpay
spring.profiles.default=dev

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info

# HMAC key for signing JWTs (min. 32 bytes). Override with VAULTPAY_JWT_SECRET outside dev.
vaultpay.jwt.secret=${VAULTPAY_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
vaultpay.jwt.ttl=PT30M

# Fixed-window rate limits. "memory" keeps counters in this JVM (fine for one dev instance);
# "redis" shares them between all instances (production).
vaultpay.rate-limit.store=memory
vaultpay.rate-limit.window=PT1M
vaultpay.rate-limit.login-per-window=10
vaultpay.rate-limit.money-per-window=30
# Only meaningful when the Redis store is used; enabled in prod.
management.health.redis.enabled=false
spring.data.redis.repositories.enabled=false
