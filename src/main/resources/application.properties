spring.application.name=vaultpay
spring.profiles.default=dev

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info

# HMAC key for signing JWTs (min. 32 bytes). Override with VAULTPAY_JWT_SECRET outside dev.
vaultpay.jwt.secret=${VAULTPAY_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
vaultpay.jwt.ttl=PT30M
