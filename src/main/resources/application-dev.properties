# Local development: in-memory H2 in PostgreSQL mode. No Docker or database install needed.
spring.datasource.url=jdbc:h2:mem:vaultpay;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=

# Reviewer account created at startup by DevReviewerBootstrap (dev profile only, simulator credentials).
vaultpay.dev.reviewer-email=reviewer@vaultpay.local
vaultpay.dev.reviewer-password=dev-reviewer-password
