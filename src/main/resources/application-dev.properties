# Local development: in-memory H2 in PostgreSQL mode. No Docker or database install needed.
spring.datasource.url=jdbc:h2:mem:vaultpay;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=

# Staff accounts created at startup by StaffBootstrap: reviewer@vaultpay.local and admin@vaultpay.local.
# Simulator-only credentials for the in-memory dev database.
vaultpay.staff.password=dev-staff-password
