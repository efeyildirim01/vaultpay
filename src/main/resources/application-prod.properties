# Either a full JDBC URL, or host/port/name parts (what Render's blueprint provides).
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
vaultpay.jwt.secret=${VAULTPAY_JWT_SECRET}
spring.data.redis.url=${REDIS_URL}
vaultpay.rate-limit.store=redis
management.health.redis.enabled=true
server.port=${PORT:8080}
# Optional: set to create reviewer@vaultpay.local and admin@vaultpay.local for a public demo.
vaultpay.staff.password=${VAULTPAY_STAFF_PASSWORD:}
