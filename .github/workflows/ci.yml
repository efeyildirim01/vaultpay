name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Same test suite twice: H2 (what runs locally) and real PostgreSQL via Testcontainers.
        db: [h2, postgres]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - name: Run tests
        run: ./gradlew test -PtestDb=${{ matrix.db }} --console=plain

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.db }}
          path: build/reports/tests/test

  web:
    name: Web dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm test
      - name: Type-check and build
        run: npm run build

  docker:
    name: Docker image + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build and start the full stack (app + PostgreSQL + Redis)
        run: docker compose up --build --detach

      - name: Smoke test over HTTP
        run: bash scripts/smoke-test.sh http://localhost:8080 local-staff-password

      - name: App logs
        if: always()
        run: docker compose logs app
