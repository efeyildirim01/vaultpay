# Full stack locally: `docker compose up --build`, then open http://localhost:8080
# Simulator-only credentials below; never reuse them anywhere real.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vaultpay
      POSTGRES_USER: vaultpay
      POSTGRES_PASSWORD: vaultpay-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultpay -d vaultpay"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/vaultpay
      DATABASE_USERNAME: vaultpay
      DATABASE_PASSWORD: vaultpay-local
      REDIS_URL: redis://redis:6379
      VAULTPAY_JWT_SECRET: local-compose-secret-change-me-0123456789abcdef
      # Creates reviewer@vaultpay.local and admin@vaultpay.local with this password.
      VAULTPAY_STAFF_PASSWORD: local-staff-password
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
